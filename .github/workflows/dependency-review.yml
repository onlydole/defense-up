name: Dependency review

on:
  pull_request:
    branches:
      - main

# Start every job with no token permissions and grant scopes per job.
permissions: {}

concurrency:
  group: dependency-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # compare the dependency graph of the base and head commits
    steps:
      # Compares dependencies between the base branch and the PR through the
      # GitHub API, so it needs no checkout. The PR fails if it adds a
      # dependency with a known high or critical vulnerability.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
