name: zizmor

on:
  push:
    branches:
      - main
  pull_request:

# Start every job with no token permissions and grant scopes per job.
permissions: {}

concurrency:
  group: zizmor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: Audit workflows with zizmor
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload SARIF results to code scanning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      # Findings show up in the Security tab and on the PR. The action installs
      # zizmor from a hash-pinned wheel. Pin the zizmor version too, so a new
      # release can't change the rules without a reviewed PR.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.31.1"
          persona: pedantic
