name: PR build

on:
  pull_request:
    branches:
      - main

# Start every job with no token permissions and grant scopes per job.
permissions: {}

# A new push to the same PR cancels the older, now stale build.
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build image (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read # check out the PR source
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Run the unit tests inside the builder image, against the same locked
      # packages the runtime image gets.
      - name: Run unit tests
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build both platforms the release ships. Nothing is pushed, so this job
      # needs no registry login and no packages permission.
      - name: Build multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          # The PR build may use the Actions cache for speed. The release
          # workflow never reads this cache.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max

      # Load the amd64 image into the local Docker engine so the next step can
      # run it. The layers come from the cache the previous step filled.
      - name: Load amd64 image for a smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: defense-up:pr
          cache-from: type=gha

      # Prove the image starts as a non-root user and gunicorn answers, with the
      # same restrictions docker-compose.yml and the Kubernetes example apply.
      - name: Smoke test
        run: |
          user="$(docker image inspect --format '{{.Config.User}}' defense-up:pr)"
          echo "Image user is ${user}"
          if [ -z "${user}" ] || [ "${user%%:*}" = "0" ] || [ "${user%%:*}" = "root" ]; then
            echo "::error::Image runs as root"
            exit 1
          fi

          docker run --detach --name smoke \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --memory 128m \
            --pids-limit 64 \
            --publish 127.0.0.1:5000:5000 \
            defense-up:pr
          trap 'docker logs smoke; docker rm --force smoke' EXIT

          curl --fail --silent --show-error --retry 10 --retry-delay 1 \
            --retry-all-errors http://127.0.0.1:5000/
          echo
          curl --fail --silent --show-error http://127.0.0.1:5000/healthz
          echo
          curl --silent --show-error --head http://127.0.0.1:5000/ \
            | grep --ignore-case --quiet "x-content-type-options: nosniff"
          docker logs smoke 2>&1 | grep --quiet "gunicorn"

      # Fail the PR if the image carries a high or critical vulnerability that
      # already has a fix. Findings without a fix are listed but don't block.
      - name: Scan image for vulnerabilities
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: defense-up:pr
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          output-format: table
