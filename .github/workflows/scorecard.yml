name: Scorecard

on:
  # Rerun when branch protection changes, so the score tracks the settings.
  branch_protection_rule:
  schedule:
    - cron: "23 6 * * 1"
  push:
    branches:
      - main

# Start every job with no token permissions and grant scopes per job.
permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      security-events: write # upload SARIF results to code scanning
      id-token: write # sign the results so the Scorecard API accepts them
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      # publish_results sends the score to the public Scorecard API, which
      # backs the badge in the README.
      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
          category: scorecard
