# The signing identity of every release is this file's path plus the tag, for
# example https://github.com/onlydole/defense-up/.github/workflows/release.yml@refs/tags/v1.0.0
# Renaming this file changes that identity and breaks the documented verify commands.
name: Release

on:
  push:
    tags:
      - "v*"

# Start every job with no token permissions and grant scopes per job.
permissions: {}

# One release run per tag at a time. Never cancel a release halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tagged source
      packages: write # push the image to GHCR
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      # No build cache here. A release builds from a clean slate so a poisoned
      # cache entry from another workflow can't end up in a signed image.
      - name: Build and push image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # BuildKit records how the image was built and stores it next to the image.
          provenance: mode=max

  sbom:
    name: Generate SBOM
    needs: build
    runs-on: ubuntu-latest
    # The image is public, so Syft can pull it without a token. This keeps the
    # third-party SBOM tool away from any write or signing permission.
    permissions: {}
    steps:
      - name: Generate CycloneDX SBOM with Syft
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          format: cyclonedx-json
          output-file: container-sbom.json
          upload-artifact: false
          upload-release-assets: false

      # Hand the exact SBOM file to the attest and release jobs.
      - name: Upload SBOM for later jobs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: container-sbom.json
          if-no-files-found: error
          retention-days: 7

  sign-and-attest:
    name: Sign and attest image
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      id-token: write # request a GitHub OIDC token for keyless Sigstore signing
      packages: write # store the signature and attestations next to the image in GHCR
      attestations: write # record the attestations in the GitHub attestations API
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      # Sign the digest once. Every tag points at this digest, so one signature
      # covers them all. cosign v3 writes a Sigstore bundle as an OCI referrer.
      - name: Sign image with cosign (keyless)
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # download-artifact checks the file against the digest recorded at upload
      # and fails on a mismatch.
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          digest-mismatch: error

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
          # Storage records only work for organization-owned repositories.
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          sbom-path: container-sbom.json
          push-to-registry: true
          create-storage-record: false

  verify:
    name: Verify signature and attestations
    needs: [build, sign-and-attest]
    runs-on: ubuntu-latest
    # Read only. This job checks the work of the jobs above the same way a
    # user would, and the release only publishes if every check passes.
    permissions:
      attestations: read # look up attestations for the digest
    env:
      DIGEST: ${{ needs.build.outputs.digest }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: "v3.1.4"

      # Exact identity, not a regular expression. Only this workflow file,
      # running for this tag, can produce a signature that passes.
      - name: Verify cosign signature
        run: |
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

      - name: Verify build provenance attestation
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --deny-self-hosted-runners

      - name: Verify SBOM attestation
        run: |
          gh attestation verify "oci://${IMAGE}@${DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --predicate-type "https://cyclonedx.org/bom" \
            --deny-self-hosted-runners

  release:
    name: Publish GitHub release
    needs: [build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the SBOM asset
    steps:
      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          digest-mismatch: error

      # The quoted heredoc keeps the shell from expanding anything. envsubst
      # then fills in only the variables listed, so a value can't inject code.
      - name: Write release notes
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          cat > notes.template.md <<'EOF'
          ## Container image

          Pull the image by digest.

          ```bash
          docker pull ${IMAGE}@${DIGEST}
          ```

          The `${TAG}` tag points at the same digest.

          ## Verify it yourself

          ### Signature

          ```bash
          cosign verify ${IMAGE}@${DIGEST} \
            --certificate-identity https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/${TAG} \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          ```

          ### Build provenance

          ```bash
          gh attestation verify oci://${IMAGE}@${DIGEST} -R ${REPO}
          ```

          ### SBOM attestation

          ```bash
          gh attestation verify oci://${IMAGE}@${DIGEST} -R ${REPO} \
            --predicate-type https://cyclonedx.org/bom
          ```

          ### Release and SBOM asset

          ```bash
          gh release verify ${TAG} -R ${REPO}
          gh release download ${TAG} -p container-sbom.json -R ${REPO}
          gh release verify-asset ${TAG} container-sbom.json -R ${REPO}
          ```

          ## Included artifacts

          - Multi-platform container image for linux/amd64 and linux/arm64
          - Keyless cosign signature stored next to the image in GHCR
          - SLSA build provenance attestation from GitHub
          - CycloneDX SBOM attestation from GitHub, with the same SBOM attached to this release
          EOF
          # The single quotes are intentional. envsubst reads the variable list literally.
          # shellcheck disable=SC2016
          envsubst '${IMAGE} ${DIGEST} ${TAG} ${REPO}' < notes.template.md > notes.md

      # With assets, gh creates a draft, uploads the SBOM, and only then
      # publishes. That order works with immutable releases, which lock assets
      # at publish time.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" container-sbom.json \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Release ${TAG}" \
            --notes-file notes.md \
            --generate-notes
